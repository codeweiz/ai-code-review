[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
description = "应用模块"
authors = [
    { name = "Zhou Wei", email = "zhouwei@chances.com.cn" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "common",
    "httpx>=0.28.1",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "dependency-injector>=4.48.1",
    "flower>=2.0.0",
]

[tool.uv.sources]
common = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
