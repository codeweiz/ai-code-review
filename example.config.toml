[llm]
# LLM 提供商: openai, ollama
provider = "ollama"
# 模型名称：qwen-plus, deepseek-r1:32b
model_name = "deepseek-r1:32b"
# API 密钥
api_key = ""
# API Base URL：https://dashscope.aliyuncs.com/compatible-mode/v1, http://127.0.0.1:11434
base_url = "http://127.0.0.1:11434"
# 温度参数 (0.0-2.0)
temperature = 0.7

[[datasource]]
# 数据源名称
name = "your_datasource_name"
# MySQL 数据库配置
host = "127.0.0.1"
port = 3306
username = "root"
password = "123456"
database = "your_database_name"
charset = "utf8mb4"
# 连接池配置
pool_size = 10
max_overflow = 20
pool_timeout = 30
pool_recycle = 3600
# 是否打印SQL语句
echo = false

[redis]
# Redis 服务配置
host = "localhost"
port = 6379
password = ""
db = 0
# 连接池配置
max_connections = 10
socket_timeout = 5
socket_connect_timeout = 5

[gitea]
# Gitea 基础 URL
base_url = ""
# Gitea 令牌
token = ""
# Gitea webhook secret
webhook_secret = ""

[gitee]
# Gitee 基础 URL
base_url = "https://gitee.com/api/v5"
# Gitee 令牌
token = ""
# Gitee webhook secret
webhook_secret = ""

[github]
# GitHub 基础 URL
base_url = "https://api.github.com"
# GitHub 令牌
token = ""
# GitHub webhook secret
webhook_secret = ""

[langsmith]
# 是否开启 LangSmith Tracing
tracing = false
# LangSmith API Key
api_key = "your_langsmith_api_key"
# LangSmith Project
project = "default"
